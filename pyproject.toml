[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indictax"
version = "0.1.0"
description = "Measure (and then close) the inference tax Indian languages pay on commodity hardware."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "tokenizers>=0.19",
  "regex>=2024.4.16",
  "numpy>=1.26",
]

[project.optional-dependencies]
hf = ["datasets>=2.19", "huggingface_hub>=0.23"]
openai-tok = ["tiktoken>=0.7"]
dev = ["pytest>=8.0"]

[project.scripts]
indictax = "indictax.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
