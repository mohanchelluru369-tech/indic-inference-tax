# Tokenizers for Experiment 01. Only tokenizer.json is downloaded (a few MB each), never weights.
#
# `verified: false` means the repo id was written from memory in a sandbox that
# could not reach Hugging Face. `indictax fertility` skips anything that fails
# to load and tells you why, so a wrong id costs nothing; fix it here and re-run.
# Gated originals (meta-llama/*, google/*) need HF_TOKEN; the ungated mirrors
# below carry the identical tokenizer.
tokenizers:
  - spec: unsloth/Llama-3.2-3B-Instruct
    family: Llama 3 (128k vocab)
    verified: false
  - spec: unsloth/gemma-3-4b-it
    family: Gemma 3 (262k vocab)
    verified: false
  - spec: Qwen/Qwen3-4B
    family: Qwen 3 (152k vocab)
    verified: false
  - spec: microsoft/Phi-4-mini-instruct
    family: Phi-4 mini (200k vocab)
    verified: false
  - spec: HuggingFaceTB/SmolLM3-3B
    family: SmolLM3
    verified: false
  - spec: openai/gpt-oss-20b
    family: OpenAI o200k (the tokenizer behind GPT-4o-class APIs)
    verified: false
  - spec: sarvamai/sarvam-1
    family: Sarvam-1, Indic-first tokenizer (the "what good looks like" reference)
    verified: false
  - spec: krutrim-ai-labs/Krutrim-2-instruct
    family: Krutrim 2, Indian sovereign model
    verified: false

