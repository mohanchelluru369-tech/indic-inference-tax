# Experiment 02, contrast model: Llama 3.2 3B (Q4_K_M) on llama.cpp.
# Chosen because its 128k tokenizer has far thinner Indic coverage than Gemma's
# 262k one: same engine, same machine, different tokenizer tax.
# Start the server first:  ./scripts/serve_llamacpp.sh bartowski/Llama-3.2-3B-Instruct-GGUF:Q4_K_M
name: exp02-llama32-3b
corpus: data/prompts/seed_v0.jsonl

system_prompt: "Reply in the same language and the same script as the user's message."

endpoint:
  base_url: http://127.0.0.1:8080/v1
  model: llama-3.2-3b-instruct
  label: llama-3.2-3b-instruct.Q4_K_M@llama.cpp
  extra_body:
    cache_prompt: false

decode:
  max_tokens: 384
  temperature: 0.0
  seed: 0

repeats: 3
warmup: 2
cooldown_s: 1.0
shuffle_seed: 7

power:
  sampler: auto
  interval_ms: 250
  idle_baseline_s: 10
